<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Analysis Engine</title>
    <meta name="description" content="Explainable analysis of NSE/BSE companies: fair-value ranges, confidence and a plain-language verdict." />
    <meta property="og:title" content="Stock Analysis Engine" />
    <meta property="og:description" content="Explainable analysis of NSE/BSE companies: fair-value ranges, confidence and a plain-language verdict." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1c2028" />
    <script>
      // Apply the saved theme before first paint (default: dim).
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'dim'
      } catch (e) { document.documentElement.dataset.theme = 'dim' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
